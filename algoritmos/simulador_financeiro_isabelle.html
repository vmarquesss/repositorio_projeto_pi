<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice de Ruptura</title>
</head>
<body>

    <h1>Índice de Ruptura</h1>
    
    <span>Falta de produto nas prateleiras:</span> <br>
    <input type="text" id="inp_falta"><br>

    <span>Total do produto no estoque no início do mês:</span> <br>
    <input type="text" id="inp_estoque"><br>

    <button onclick="ruptura()">Analisar ruptura</button>  
    <div id="div_msg"></div>

</body>
</html>

<script>

    let mes = 0;

    function ruptura() {

        let estoqueInicial = Number(inp_estoque.value);
        let faltaProduto = Number(inp_falta.value);

        let rup = (faltaProduto / estoqueInicial) * 100;

        mes += 1;
        div_msg.innerHTML += `Relatorio: ${mes} <br> foi registrado ${rup.toFixed(2)}% de ruptura de estoque <br>`;

        if (estoqueInicial <= 0){
            mes -= 1
            div_msg.innerHTML = `<span style="color: red;">Por favor, insira valores válidos maiores que zero.</span><br>`;

        }else if(rup <= 2){
            div_msg.innerHTML += `<span style="color: green;">Sem preucupação por enquanto</span> <br>`
        } else if (rup >= 20 ){
            div_msg.innerHTML += `<span style="color: red;background-color: black;">Alta taxa de ruptura, possiveis grande perda de lucro</span> <br>`
        } else {
            div_msg.innerHTML += `<span style="color: yellow;background-color: black;">Dar uma atenção a mais</span> <br>`
        }


        
    }

</script>
