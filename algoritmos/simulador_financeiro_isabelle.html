<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Indice de ruptura</h1>
    
    <span>Falta de produto na contagem :</span> <br>
    <input type="text" id="inp_total"><br>

    <span>Total do produto no inicio mês:</span> <br>
    <input type="text" id="inp_itens"><br>

    <button onclick="ruptura()">Analisar ruptura</button> 
     <div id="div_msg"></div>

    <h1>Quebra</h1>

    <span>Vendas diarias:</span> <br>
    <input type="text" id="inp_diaria"><br>

    <span>Dias sem restoques:</span> <br>
    <input type="text" id="inp_zerado"><br>

    <span>Preço do produto:</span> <br>
    <input type="text" id="inp_preco"><br>

    <button onclick="quebra()">Analisar Quebra</button>
    <div id="div_msg2"></div>





    

   


</body>
</html>

<script>

    let mes = 0;

    function ruptura() {

        let totalItens = Number(inp_itens.value);
        let totalVendido = Number(inp_total.value);

        let rup = (totalVendido / totalItens) * 100;
        mes += 1;
        div_msg.innerHTML += `Mes: ${mes} <br> foi registrado ${rup.toFixed(2)}%  de ruptura de estoque, levando a perda de cliente <br>`;


    }

    function quebra(){

        let zerado = Number(inp_zerado.value);
        let diario = Number(inp_diaria.value);
        let preco = Number(inp_preco.value);

        let quebra = diario * zerado * preco;
        div_msg2.innerHTML += `Nos ${zerado} dias que não foram feito estoques houve uma perda de R$${quebra} no final mês.<br> `;

    }


</script>
