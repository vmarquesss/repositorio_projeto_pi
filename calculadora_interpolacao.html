<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Interpolação</title>
    <!-- 
    
    -->
</head>
<body>
    <h2>Calculadora</h2> <br>

    <input type="text" id="ipt_numero1" />
    <input type="text" id="ipt_numero2" />
   <!-- 
    max='10': definir o numero maximo; min='...';

    -->
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="dividir()">Dividir</button>
    <button onclick="subtrair()">Subtrair</button>
    <button onclick="adição()">Somar</button>

    <div id="div_exibir"></div>
</body>
</html>
<script>
    function multiplicar() {
        div_exibir.innerHTML = `O resultado da multiplicação é: ${Number(ipt_numero1.value) * Number(ipt_numero2.value)}`;
    }

    function dividir() {
        div_exibir.innerHTML = `O resultado da divição é: ${Number(ipt_numero1.value) / Number(ipt_numero2.value)}`;
    }

    function subtrair() {
        div_exibir.innerHTML = `O resultado da subtração é: ${Number(ipt_numero1.value) - Number(ipt_numero2.value)}`;
    }

    function adição() {
        div_exibir.innerHTML = `O resultado da subtração é: ${Number(ipt_numero1.value) + Number(ipt_numero2.value)}`
        //'O resultado da subtração é: ' + (Number(ipt_numero1.value) + Number(ipt_numero2.value));
    }
</script>

<!-- 
subtrair precisa estar entre (), se nao ele subtrai texto com value
somar precisa de (Number(value))
quando se trabalha com calculo é bom converter tudo pra number

-->
